name: Temporary MapLibre security upgrade

on:
  push:
    branches:
      - chore/ikigai-prod-audit

permissions:
  contents: write

jobs:
  upgrade-maplibre:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/ikigai-prod-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Upgrade MapLibre and regenerate lockfile
        run: npm install maplibre-gl@6.9.0 --save-exact --package-lock-only
      - name: Commit generated manifests and remove temporary workflow
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp-maplibre-lock.yml
          git add web/package.json web/package-lock.json
          git commit -m "fix(security): upgrade MapLibre GL to 6.9.0"
          git push origin HEAD:chore/ikigai-prod-audit
