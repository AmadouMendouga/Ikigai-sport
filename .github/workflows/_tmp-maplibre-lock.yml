name: Temporary MapLibre lockfile generator

on:
  push:
    branches:
      - chore/ikigai-prod-audit

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Generate MapLibre 6.9 lockfile
        run: npm install maplibre-gl@6.9.0 --save-exact --package-lock-only
      - name: Upload generated manifests
        uses: actions/upload-artifact@v4
        with:
          name: maplibre-manifests
          path: |
            web/package.json
            web/package-lock.json
          if-no-files-found: error
