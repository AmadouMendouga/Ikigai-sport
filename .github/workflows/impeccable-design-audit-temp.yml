name: Impeccable design audit (temporary)

on:
  push:
    branches:
      - audit/impeccable-design-check

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare report directory
        run: mkdir -p reports/impeccable

      - name: Scan project source
        shell: bash
        run: |
          set +e
          npx --yes impeccable@latest detect --json web/ > reports/impeccable/source.json 2> reports/impeccable/source.stderr.txt
          code=$?
          echo "$code" > reports/impeccable/source.exit-code.txt
          echo "Impeccable source scan exit code: $code"
          sed -n '1,220p' reports/impeccable/source.stderr.txt || true
          exit 0

      - name: Scan production desktop
        shell: bash
        run: |
          set +e
          npx --yes impeccable@latest detect --json --viewport 1280x800 https://ikigai-sport.naragroup.cc.cd/ > reports/impeccable/production-desktop.json 2> reports/impeccable/production-desktop.stderr.txt
          code=$?
          echo "$code" > reports/impeccable/production-desktop.exit-code.txt
          echo "Impeccable desktop scan exit code: $code"
          sed -n '1,220p' reports/impeccable/production-desktop.stderr.txt || true
          exit 0

      - name: Scan production mobile
        shell: bash
        run: |
          set +e
          npx --yes impeccable@latest detect --json --viewport 390x844 https://ikigai-sport.naragroup.cc.cd/ > reports/impeccable/production-mobile.json 2> reports/impeccable/production-mobile.stderr.txt
          code=$?
          echo "$code" > reports/impeccable/production-mobile.exit-code.txt
          echo "Impeccable mobile scan exit code: $code"
          sed -n '1,220p' reports/impeccable/production-mobile.stderr.txt || true
          exit 0

      - name: Record detector version
        shell: bash
        run: |
          npx --yes impeccable@latest --version > reports/impeccable/version.txt 2>&1 || true
          date -u +'%Y-%m-%dT%H:%M:%SZ' > reports/impeccable/audited-at.txt

      - name: Commit audit results and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/impeccable-design-audit-temp.yml
          git add reports/impeccable .github/workflows/impeccable-design-audit-temp.yml
          git commit -m "audit: record Impeccable design findings" || exit 0
          git push
