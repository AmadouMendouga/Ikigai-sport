name: Temporary Firebase Admin lockfile upgrade

on:
  push:
    branches:
      - chore/ikigai-firebase14

permissions:
  contents: write

jobs:
  upgrade-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Regenerate lockfile with Firebase Admin 14.4.0
        run: npm install firebase-admin@14.4.0 --save-exact --package-lock-only
      - name: Commit manifests and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd ..
          rm .github/workflows/_tmp-firebase-lock.yml
          git add web/package.json web/package-lock.json .github/workflows/_tmp-firebase-lock.yml
          git commit -m "chore(security): upgrade Firebase Admin to 14.4.0" || exit 0
          git push
