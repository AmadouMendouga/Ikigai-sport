name: Temporary production audit fix

on:
  push:
    branches:
      - chore/ikigai-firebase14

permissions:
  contents: write

jobs:
  fix-prod-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Apply non-breaking production audit fixes
        run: npm audit fix --omit=dev
      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd ..
          rm .github/workflows/_tmp-prod-audit-fix.yml
          git add web/package-lock.json web/package.json .github/workflows/_tmp-prod-audit-fix.yml
          git commit -m "fix(security): resolve remaining production dependency advisories" || exit 0
          git push
