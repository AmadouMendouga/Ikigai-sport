name: IKIGAI Production Browser Smoke

on:
  pull_request:
    paths:
      - "web/tests/browser-smoke-remote.mjs"
      - ".github/workflows/ikigai-browser-smoke.yml"
  push:
    branches:
      - master
    paths:
      - "web/**"
      - ".github/workflows/ikigai-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  smoke-production:
    name: Public browser smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      LMI_AUDIT_BASE_URL: https://ikigai-sport.naragroup.cc.cd/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Sur master, attendre que Vercel ait réellement publié le projet web
      # correspondant au commit avant d'auditer le domaine de production.
      # Sur une PR, le smoke vérifie la production courante pour valider le
      # mécanisme lui-même, sans prétendre tester le code non encore déployé.
      - name: Wait for Vercel web deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 36); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" \
              --jq '[.statuses[] | select(.context == "Vercel – le-maillot-ideal-preview")][0].state // "pending"')
            echo "Vercel web status: ${state}"
            if [ "${state}" = "success" ]; then
              exit 0
            fi
            if [ "${state}" = "failure" ] || [ "${state}" = "error" ]; then
              exit 1
            fi
            sleep 10
          done
          echo "Le déploiement Vercel web n'a pas atteint success dans la fenêtre de contrôle."
          exit 1

      - name: Run public browser smoke
        run: node tests/browser-smoke-remote.mjs
