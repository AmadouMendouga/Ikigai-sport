name: Impeccable fix diagnostics (temporary)

on:
  push:
    branches:
      - fix/impeccable-design-errors

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Relevant source contexts
        shell: bash
        run: |
          echo '=== literal colors / catalogue / footer / glow ==='
          grep -RniE '#162033|articles au catalogue|dernières arrivées|site-footer|footer-grid|rgba\(34, *197, *94|--e8' web/app web/components || true
          echo '=== layout transitions ==='
          grep -RniE 'transition:[^;]*(max-height|width|padding|padding-bottom|padding-left)' web/app web/components || true
          echo '=== overshoot easing ==='
          grep -RniE 'cubic-bezier\([^)]*1\.[0-9]' web/app web/components || true
          echo '=== contexts around known lmi.css findings ==='
          for range in '1128,1350' '1368,1460' '1704,1724' '2188,2206' '2258,2280' '2356,2378'; do
            echo "--- lmi.css $range ---"
            sed -n "${range}p" web/app/lmi.css | nl -ba -v "${range%,*}"
          done
          echo '=== ContainerTextFlip ==='
          nl -ba web/components/ContainerTextFlip.tsx | sed -n '35,70p'
