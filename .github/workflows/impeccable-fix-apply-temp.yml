name: Apply Impeccable design corrections (temporary)

on:
  push:
    branches:
      - fix/impeccable-design-errors

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Apply targeted design fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def must_replace(text, old, new, label, count=1):
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{label}: expected {count} occurrence(s), found {found}")
              return text.replace(old, new)

          lmi_path = Path('web/app/lmi.css')
          lmi = lmi_path.read_text()

          # Impeccable: remove colored glow elevation; keep brand color in fills/borders.
          lmi = must_replace(
              lmi,
              '--e8: 0 8px 22px rgba(34, 197, 94, .28);',
              '--e8: 0 8px 22px rgba(15, 23, 42, .14);',
              'neutral elevation token',
          )
          lmi = must_replace(
              lmi,
              '.btn-whatsapp { background: var(--whatsapp); color: #fff; box-shadow: 0 6px 18px rgba(34, 197, 94, .3); }',
              '.btn-whatsapp { background: var(--whatsapp); color: #fff; box-shadow: 0 4px 12px rgba(15,23,42,.16); }',
              'WhatsApp neutral shadow',
          )

          # Impeccable: replace overshoot/bounce curves with a smooth ease-out curve.
          lmi, bounce_count = re.subn(
              r'cubic-bezier\(\.34,1\.[0-9]+,\.[0-9]+,1\)',
              'cubic-bezier(.22,1,.36,1)',
              lmi,
          )
          if bounce_count != 12:
              raise SystemExit(f'overshoot easing: expected 12 replacements, found {bounce_count}')

          # Impeccable: do not animate layout dimensions/spacing.
          lmi = must_replace(
              lmi,
              'body { padding-bottom: 0; transition: padding-bottom .3s ease; }',
              'body { padding-bottom: 0; }',
              'body padding transition',
          )
          lmi = must_replace(
              lmi,
              '  transition: width .25s ease, background-color .25s ease;',
              '  transition: background-color .25s ease;',
              'testimonial progress width transition',
          )
          lmi = must_replace(
              lmi,
              '  border: none; padding: 0; transition: width .25s ease, background-color .25s ease;',
              '  border: none; padding: 0; transition: background-color .25s ease;',
              'portal hero dot width transition',
          )
          lmi = must_replace(
              lmi,
              '  transition: width .2s ease, transform .2s ease;',
              '  transition: transform .2s ease;',
              'stateful icon width transition',
          )
          lmi = must_replace(
              lmi,
              '  transition: padding .3s ease;',
              '  transition: none;',
              'portal header padding transition',
          )
          lmi = must_replace(
              lmi,
              '  transition: color .2s ease, padding-left .2s ease;',
              '  transition: color .2s ease, transform .2s ease;',
              'drawer padding transition',
          )
          lmi = must_replace(
              lmi,
              '.portal-drawer-list a:hover { color: var(--primary); padding-left: 8px; }',
              '.portal-drawer-list a:hover { color: var(--primary); transform: translateX(8px); }',
              'drawer hover transform',
          )

          # Footer rhythm: headings introduce their own grid column with visible separation.
          lmi = must_replace(
              lmi,
              '.footer-grid h4 { color: var(--on-surface); font-size: .84rem; margin-bottom: 14px; text-transform: uppercase; letter-spacing: .06em; }',
              '.footer-grid h4 { color: var(--on-surface); font-size: .84rem; margin: 16px 0 10px; text-transform: uppercase; letter-spacing: .06em; }',
              'footer heading rhythm',
          )

          # Hero controls: defined edge without a wide diffuse external shadow.
          lmi = must_replace(
              lmi,
              '  box-shadow: 0 4px 18px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.4);',
              '  box-shadow: inset 0 1px 0 rgba(255,255,255,.4);',
              'hero control shadow',
          )
          lmi_path.write_text(lmi)

          ui_path = Path('web/app/ikigai-ui.css')
          ui = ui_path.read_text()
          ui = must_replace(
              ui,
              'box-shadow: 0 -3px 18px rgb(24 39 29 / 6%); transition: max-height .2s ease-out;',
              'box-shadow: 0 -3px 12px rgb(24 39 29 / 6%);',
              'delivery sheet max-height transition',
          )
          ui_path.write_text(ui)

          flip_path = Path('web/components/ContainerTextFlip.tsx')
          flip = flip_path.read_text()
          flip = must_replace(
              flip,
              '      style={{ width, transition: reduce ? "none" : `width ${duration}ms ease-in-out` }}',
              '      style={{ width }}',
              'text flip width transition',
          )
          flip_path.write_text(flip)

          final_path = Path('web/app/ikigai-refonte-v2-finalize.css')
          final = final_path.read_text()
          marker = '/* Impeccable 4.1 — contraste du hero et surfaces sans effet IA. */'
          if marker not in final:
              final += '''\n\n/* Impeccable 4.1 — contraste du hero et surfaces sans effet IA. */\n.ik-app .portal-hero-scrim::after {\n  background: linear-gradient(90deg, rgb(0 0 0 / 68%) 0%, rgb(0 0 0 / 28%) 58%, transparent 88%);\n}\n\n.ik-app .portal-hero-content h1,\n.ik-app .portal-hero-content h2,\n.ik-app .portal-hero-content p {\n  color: #fff;\n  text-shadow: none;\n}\n\n.ik-app .portal-hero-content p { opacity: 1; }\n\n/* Les colonnes de navigation du footer gardent le même rythme. */\n.ik-app .footer-grid > div:not(.footer-brand) h4 {\n  margin-top: 16px;\n  margin-bottom: 10px;\n}\n'''
          final_path.write_text(final)
          PY

      - name: Verify Impeccable source scan
        shell: bash
        run: |
          set +e
          npx --yes impeccable@4.1.0 detect --json web/ > /tmp/impeccable-after.json
          code=$?
          set -e
          cat /tmp/impeccable-after.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/impeccable-after.json').read_text() or '[]')
          print(f'Impeccable findings after fixes: {len(data)}')
          if data:
              raise SystemExit(1)
          PY
          test "$code" -eq 0

      - name: Install app dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: TypeScript
        working-directory: web
        run: npx tsc --noEmit

      - name: Commit fixes and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/impeccable-fix-diagnostics-temp.yml .github/workflows/impeccable-fix-apply-temp.yml
          git add web/app/lmi.css web/app/ikigai-ui.css web/app/ikigai-refonte-v2-finalize.css web/components/ContainerTextFlip.tsx .github/workflows
          git commit -m "fix(web): address Impeccable design findings"
          git push
