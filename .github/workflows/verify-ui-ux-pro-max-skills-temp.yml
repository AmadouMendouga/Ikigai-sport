name: Verify UI UX Pro Max skills (temporary)

on:
  push:
    branches:
      - chore/install-ui-ux-pro-max-skills
    paths:
      - .github/workflows/verify-ui-ux-pro-max-skills-temp.yml

permissions:
  contents: write

jobs:
  verify-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify all seven skills exist for both agent layouts
        shell: bash
        run: |
          set -euo pipefail
          for root in .claude/skills .agents/skills; do
            for skill in banner-design brand design-system design slides ui-styling ui-ux-pro-max; do
              test -f "$root/$skill/SKILL.md"
            done
          done
          test -f third_party/ui-ux-pro-max-skill/LICENSE
          test -f third_party/ui-ux-pro-max-skill/NOTICE.md

      - name: Smoke-test Claude UI UX Pro Max search engine
        shell: bash
        run: |
          set -euo pipefail
          python3 .claude/skills/ui-ux-pro-max/scripts/search.py "sports ecommerce mobile" --design-system -p "IKIGAI Sport" > /tmp/uiux-design-system.txt
          python3 .claude/skills/ui-ux-pro-max/scripts/search.py "responsive product card" --stack nextjs > /tmp/uiux-nextjs.txt
          test -s /tmp/uiux-design-system.txt
          test -s /tmp/uiux-nextjs.txt

      - name: Smoke-test universal UI UX Pro Max search engine
        shell: bash
        run: |
          set -euo pipefail
          python3 .agents/skills/ui-ux-pro-max/scripts/search.py "checkout accessibility" --domain ux > /tmp/uiux-universal.txt
          test -s /tmp/uiux-universal.txt

      - name: Remove temporary verification workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-ui-ux-pro-max-skills-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-ui-ux-pro-max-skills-temp.yml
          git commit -m "chore: remove temporary skills verification workflow"
          git push origin HEAD:chore/install-ui-ux-pro-max-skills
